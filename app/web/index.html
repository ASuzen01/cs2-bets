<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>CS2 BETS</title>
<!-- BOOTSTRAP -->
<script async src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
/* Мост к Telegram без ожидания внешнего SDK.
   Telegram кладёт данные приложения в hash: #tgWebAppData=...&tgWebAppVersion=...
   Если telegram.org недоступен (бывает), приложение всё равно работает. */
(function () {
  var hash = (location.hash || "").replace(/^#/, "");
  var params = {};
  hash.split("&").forEach(function (part) {
    var i = part.indexOf("=");
    if (i > 0) params[decodeURIComponent(part.slice(0, i))] = decodeURIComponent(part.slice(i + 1));
  });

  var initData = params.tgWebAppData || "";
  var theme = {};
  if (params.tgWebAppThemeParams) {
    try { theme = JSON.parse(params.tgWebAppThemeParams); } catch (e) { theme = {}; }
  }
  var user = {};
  if (initData) {
    try { user = JSON.parse(new URLSearchParams(initData).get("user") || "{}"); } catch (e) { user = {}; }
  }
  function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

  window.__TG_SHIM__ = {
    initData: initData,
    initDataUnsafe: { user: user },
    themeParams: theme,
    platform: params.tgWebAppPlatform || "",
    version: params.tgWebAppVersion || "",
    ready: function () {},
    expand: function () {},
    close: function () {},
    setHeaderColor: function () {},
    setBackgroundColor: function () {},
    disableVerticalSwipes: function () {},
    HapticFeedback: {
      impactOccurred: function () { buzz(8); },
      notificationOccurred: function () { buzz(20); }
    }
  };
})();
</script>
<style>
  :root{
    --bg:#0f1720; --bg2:#151d26; --card:#1a2431; --card2:#202c3b;
    --text:#eaf0f6; --muted:#8496a8; --accent:#4dabf7; --accent-soft:#1d3549;
    --ok:#37b24d; --warn:#f5a623; --bad:#e03131; --line:#22303f;
    --radius:16px; --tabbar:64px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:15px;line-height:1.45;overscroll-behavior-y:contain}
  body{padding-bottom:calc(var(--tabbar) + 12px)}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

  header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;
    padding:12px 16px;background:linear-gradient(180deg,#131c26,rgba(19,28,38,.92));
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .logo{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
    background:linear-gradient(135deg,#2f7fd1,#4dabf7);font-size:18px}
  .who{flex:1;min-width:0}
  .who b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who span{font-size:11.5px;color:var(--muted)}
  .balance{display:flex;align-items:center;gap:6px;background:#1b2a1f;border:1px solid #23452c;
    color:#a9e6b8;padding:7px 11px;border-radius:12px;font-weight:700;font-size:14px;white-space:nowrap}
  .balance.flash{animation:flash .6s ease}
  @keyframes flash{0%{transform:scale(1)}40%{transform:scale(1.08);background:#254e30}100%{transform:scale(1)}}

  main{max-width:560px;margin:0 auto;padding:14px 14px 8px}
  .screen{display:none;animation:fade .18s ease}
  .screen.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
    margin:2px 0 10px;font-weight:700}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 13px;margin-bottom:10px}
  .card .top{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:11.5px;margin-bottom:7px}
  .card .top .tour{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .teams{display:flex;flex-direction:column;gap:7px}
  .team{display:flex;gap:8px}
  .odd{flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:var(--card2);border:1px solid #26374a;border-radius:12px;padding:10px 12px;
    transition:transform .08s ease,background .15s}
  .odd:active{transform:scale(.985);background:#27384c}
  .odd .name{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .odd .val{font-variant-numeric:tabular-nums;font-weight:800;color:#8ecbff}
  .odd:disabled{opacity:.45}
  .kick{display:block;font-size:11px;color:var(--muted)}

  .chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;
    background:var(--card2);border:1px solid #26374a;font-size:12.5px;color:var(--accent)}
  .chip:active{background:#284058}

  .rowcard{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:11px 13px;margin-bottom:8px}
  .rank{width:26px;text-align:center;font-weight:800;color:var(--muted)}
  .rowcard .grow{flex:1;min-width:0}
  .rowcard .grow b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rowcard .grow span{font-size:11.5px;color:var(--muted)}
  .money{font-weight:800;font-variant-numeric:tabular-nums}
  .money.plus{color:#69db7c}.money.minus{color:#ff8787}

  .empty{text-align:center;color:var(--muted);padding:34px 12px;font-size:13.5px}

  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;
    border-radius:14px;background:linear-gradient(180deg,#3d8fd8,#2f7fd1);color:#fff;font-weight:700;
    font-size:15px;box-shadow:0 6px 18px rgba(47,127,209,.28)}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:var(--card2);color:var(--text);border:1px solid #26374a;box-shadow:none}
  .btn.small{padding:10px;font-size:13.5px;width:auto;flex:1}

  .cartbar{position:fixed;left:12px;right:12px;bottom:calc(var(--tabbar) + 10px);z-index:6;
    display:none;align-items:center;gap:10px;background:linear-gradient(180deg,#20344a,#1a2a3d);
    border:1px solid #2d4b69;border-radius:14px;padding:10px 12px;box-shadow:0 10px 26px rgba(0,0,0,.42)}
  .cartbar.show{display:flex}
  .cartbar .grow{flex:1;min-width:0}
  .cartbar .grow b{font-size:13px;display:block}
  .cartbar .grow span{font-size:11.5px;color:#9fd0ff}

  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;height:var(--tabbar);
    background:rgba(16,24,33,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
  nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;font-size:10.5px;color:var(--muted)}
  nav.tabs button.active{color:var(--accent)}
  nav.tabs .ic{font-size:19px;line-height:1}
  nav.tabs .dot{position:absolute;transform:translate(11px,-9px);min-width:16px;height:16px;border-radius:9px;
    background:#e8590c;color:#fff;font-size:10px;font-weight:800;display:none;place-items:center;padding:0 4px}
  nav.tabs .badge .dot{display:grid}

  .sheet-wrap{position:fixed;inset:0;z-index:20;display:none;background:rgba(4,8,12,.58)}
  .sheet-wrap.show{display:block}
  .sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;
    background:var(--bg2);border-radius:20px 20px 0 0;border-top:1px solid #2a3a4c;
    padding:16px 16px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease}
  @keyframes up{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
  .sheet h3{margin:0 0 2px;font-size:16px}
  .sheet .sub{color:var(--muted);font-size:12.5px;margin-bottom:14px}
  .presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
  .presets button{padding:13px 8px;border-radius:13px;background:var(--card2);border:1px solid #2a3b4f;
    font-weight:800;font-variant-numeric:tabular-nums}
  .presets button.wide{grid-column:span 3}
  .presets button:active{background:#2c4056}
  .custom{display:flex;gap:8px;margin-bottom:12px}
  .custom input{flex:1;background:#101a24;border:1px solid #27374a;border-radius:12px;padding:12px;
    color:var(--text);font-size:16px;font-variant-numeric:tabular-nums;outline:none}
  .custom input:focus{border-color:#3d8fd8}
  .summary{background:#101a24;border:1px solid #24344a;border-radius:13px;padding:11px 13px;
    margin-bottom:12px;font-size:13px;color:#c7d6e4}
  .summary b{color:#fff}
  .summary .big{font-size:19px;color:#8ecbff;font-weight:800}

  .toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(var(--tabbar) + 26px);z-index:30;
    background:#1d2b3a;border:1px solid #2c4257;color:#eaf0f6;padding:11px 16px;border-radius:12px;
    font-size:13.5px;max-width:88vw;text-align:center;opacity:0;pointer-events:none;transition:.22s}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.ok{border-color:#2f6b3d;background:#183021}
  .toast.bad{border-color:#7a2b2b;background:#2c1717}

  .kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed #223143;font-size:13.5px}
  .kv:last-child{border-bottom:0}
  .kv span{color:var(--muted)}
  .hint{color:var(--muted);font-size:12px;line-height:1.5}
  .skeleton{height:74px;border-radius:14px;margin-bottom:10px;background:linear-gradient(90deg,#1a2431,#22303f,#1a2431);
    background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{0%{background-position:0}100%{background-position:-200% 0}}
</style>
</head>
<body>
<header>
  <div class="logo">🎯</div>
  <div class="who">
    <b id="userName">CS2 BETS</b>
    <span id="userHint">кэфы Fonbet · тир-1</span>
  </div>
  <div class="balance" id="balancePill">— 🪙</div>
</header>

<main>
  <section class="screen active" id="screen-matches">
    <h2>Матчи · тир-1</h2>
    <div id="matches"></div>
  </section>

  <section class="screen" id="screen-express">
    <h2>Экспресс</h2>
    <div id="express"></div>
  </section>

  <section class="screen" id="screen-top">
    <h2>Топ по балансу</h2>
    <div id="top"><div class="skeleton"></div><div class="skeleton"></div></div>
  </section>

  <section class="screen" id="screen-history">
    <h2>История операций</h2>
    <div id="history"><div class="skeleton"></div></div>
  </section>

  <section class="screen" id="screen-me">
    <h2>Профиль</h2>
    <div id="me"></div>
  </section>
</main>

<div class="cartbar" id="cartbar">
  <div class="grow">
    <b id="cartTitle">Экспресс: 0 исходов</b>
    <span id="cartOdds">добавь минимум 2</span>
  </div>
  <button class="btn small" id="cartOpen">Открыть</button>
</div>

<nav class="tabs">
  <button class="active" data-tab="matches"><span class="ic">🎮</span>Матчи</button>
  <button data-tab="express" id="tabExpress"><span class="ic">🎟</span>Экспресс<span class="dot" id="cartDot">0</span></button>
  <button data-tab="top"><span class="ic">🏆</span>Топ</button>
  <button data-tab="history"><span class="ic">📜</span>История</button>
  <button data-tab="me"><span class="ic">💰</span>Я</button>
</nav>

<div class="sheet-wrap" id="sheetWrap">
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  "use strict";

  const boot = window.__BOOT__ || { user: null, matches: [], error: null, dev: false };
  const tg = (window.Telegram && window.Telegram.WebApp) || window.__TG_SHIM__ || null;
  const hasTelegram = !!(tg && tg.initData);

  const state = {
    user: boot.user || null,
    matches: boot.matches || [],
    bets: [],
    expresses: [],
    limits: { min_bet: 10, max_legs: 6, max_odds: 40, daily_bonus: 250 },
    cart: readCart(),
    tab: "matches",
    live: false,
    pending: null,
  };

  // ---------------------------------------------------------------- утилиты
  const $ = (sel) => document.querySelector(sel);
  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = text;
    return node;
  };
  const money = (n) => Number(n).toLocaleString("ru-RU").replace(/\u00a0/g, " ") + " 🪙";
  const oddsText = (n) => Number(n).toFixed(2);
  const balance = () => (state.user ? state.user.balance : 0);

  function timeText(ts) {
    const d = new Date(ts * 1000);
    const now = new Date();
    const hh = String(d.getHours()).padStart(2, "0");
    const mm = String(d.getMinutes()).padStart(2, "0");
    const sameDay = d.toDateString() === now.toDateString();
    const tomorrow = new Date(now.getTime() + 86400000).toDateString() === d.toDateString();
    const day = sameDay ? "сегодня" : tomorrow ? "завтра" : d.toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit" });
    return `${day} ${hh}:${mm}`;
  }

  function toast(text, kind) {
    const node = $("#toast");
    node.textContent = text;
    node.className = "toast show" + (kind ? " " + kind : "");
    clearTimeout(node._t);
    node._t = setTimeout(() => { node.className = "toast"; }, 2600);
  }

  function haptic(type) {
    try {
      if (!tg || !tg.HapticFeedback) return;
      if (type === "ok") tg.HapticFeedback.notificationOccurred("success");
      else if (type === "bad") tg.HapticFeedback.notificationOccurred("error");
      else tg.HapticFeedback.impactOccurred("light");
    } catch (e) { /* не критично */ }
  }

  // ------------------------------------------------------------- localStorage
  function readCart() {
    try {
      const raw = localStorage.getItem("cs2bets_cart");
      const parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) { return []; }
  }
  function saveCart() {
    try { localStorage.setItem("cs2bets_cart", JSON.stringify(state.cart)); } catch (e) {}
  }

  // --------------------------------------------------------------------- API
  async function api(path, options) {
    const opts = options || {};
    const headers = { "Content-Type": "application/json" };
    if (hasTelegram) headers["X-Telegram-Init-Data"] = tg.initData;

    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 15000);
    let res;
    try {
      res = await fetch(path, {
        method: opts.method || "GET",
        headers,
        body: opts.body ? JSON.stringify(opts.body) : undefined,
        signal: controller.signal,
      });
    } catch (err) {
      throw new Error(err.name === "AbortError" ? "Сервер не ответил за 15 секунд" : "Нет связи с сервером");
    } finally {
      clearTimeout(timer);
    }
    let data = null;
    try { data = await res.json(); } catch (e) { data = { ok: false, error: "Плохой ответ сервера" }; }
    if (!res.ok || data.ok === false) {
      const err = new Error(data.error || "Ошибка " + res.status);
      err.status = res.status;
      throw err;
    }
    return data;
  }

  function setBalance(value) {
    if (!state.user) return;
    state.user.balance = value;
    const pill = $("#balancePill");
    pill.textContent = money(value);
    pill.classList.remove("flash");
    void pill.offsetWidth;
    pill.classList.add("flash");
  }

  // ------------------------------------------------------------------ рендер
  function renderHeader() {
    $("#userName").textContent = state.user ? state.user.name : "CS2 BETS";
    $("#userHint").textContent = state.user
      ? (state.user.dev ? "локальный режим · кэфы Fonbet" : "кэфы Fonbet · тир-1")
      : "кэфы Fonbet · тир-1";
    $("#balancePill").textContent = state.user ? money(state.user.balance) : "— 🪙";
  }

  function renderFatal(message) {
    const host = $("#matches");
    host.textContent = "";
    const card = el("div", "card");
    card.append(el("div", "empty", message));
    const retry = el("button", "btn", "Обновить");
    retry.type = "button";
    retry.addEventListener("click", () => {
      host.textContent = "";
      host.append(el("div", "skeleton"));
      refreshState();
    });
    card.append(retry);
    host.append(card);
    $("#balancePill").textContent = "— 🪙";
  }

  function renderMatches() {
    const host = $("#matches");
    host.textContent = "";
    if (!state.user) {
      const message = boot.error && /Откройте/i.test(boot.error)
        ? "Откройте приложение кнопкой в боте — тогда появятся матчи и баланс."
        : (boot.error || "Не удалось авторизоваться. Обновите экран.");
      const card = el("div", "card");
      card.append(el("div", "empty", message));
      const retry = el("button", "btn", "Обновить");
      retry.type = "button";
      retry.addEventListener("click", () => location.reload());
      card.append(retry);
      host.append(card);
      return;
    }
    if (!state.matches.length) {
      host.append(el("div", "empty", "Сейчас нет матчей с открытыми ставками.\nЛиния тир-1 обновляется каждые 90 секунд."));
      return;
    }
    for (const match of state.matches) {
      const card = el("div", "card");

      const top = el("div", "top");
      top.append(el("span", "tour", match.short_tournament));
      top.append(el("span", "kick", timeText(match.start_time)));
      card.append(top);

      const teams = el("div", "teams");
      ["a", "b"].forEach((side) => {
        const row = el("div", "team");
        const btn = el("button", "odd");
        btn.type = "button";
        const name = el("span", "name", side === "a" ? match.team_a : match.team_b);
        const val = el("span", "val", oddsText(side === "a" ? match.odds_a : match.odds_b));
        btn.append(name, val);
        btn.addEventListener("click", () => openAmountSheet(match, side));
        row.append(btn);
        teams.append(row);
      });
      card.append(teams);

      const actions = el("div", "custom");
      actions.style.margin = "9px 0 0";
      const add = el("button", "chip", "🎟 В экспресс");
      add.type = "button";
      add.addEventListener("click", () => addLeg(match));
      actions.append(add);
      card.append(actions);

      host.append(card);
    }
  }

  function cartOdds() {
    return state.cart.reduce((acc, leg) => acc * Number(leg.odds), 1);
  }

  function renderCartBar() {
    const bar = $("#cartbar");
    const count = state.cart.length;
    $("#tabExpress").classList.toggle("badge", count > 0);
    $("#cartDot").textContent = String(count);
    if (!count) {
      bar.classList.remove("show");
      return;
    }
    bar.classList.add("show");
    $("#cartTitle").textContent = `Экспресс: ${count} ${count === 1 ? "исход" : count < 5 ? "исхода" : "исходов"}`;
    $("#cartOdds").textContent = count < 2
      ? "добавь ещё минимум один"
      : `кэф ${oddsText(cartOdds())} · выбери сумму`;
  }

  function renderExpress() {
    const host = $("#express");
    host.textContent = "";

    if (!state.cart.length) {
      const card = el("div", "card");
      card.append(el("div", "empty", "Корзина пуста.\nОткрой матч и жми «🎟 В экспресс» — можно собрать до " + state.limits.max_legs + " исходов."));
      host.append(card);
      return;
    }

    const card = el("div", "card");
    state.cart.forEach((leg, index) => {
      const row = el("div", "rowcard");
      row.style.margin = "0 0 8px";
      const num = el("div", "rank", String(index + 1));
      const grow = el("div", "grow");
      grow.append(el("b", null, leg.team));
      grow.append(el("span", null, `${leg.tournament || ""} · кэф ${oddsText(leg.odds)}`));
      const del = el("button", "chip", "✕");
      del.type = "button";
      del.addEventListener("click", () => {
        state.cart = state.cart.filter((item) => !(item.match_id === leg.match_id));
        saveCart(); renderExpress(); renderCartBar();
        haptic("light");
      });
      row.append(num, grow, del);
      card.append(row);
    });

    const total = cartOdds();
    const summary = el("div", "summary");
    summary.innerHTML = "";
    summary.append(el("div", null, `Исходов: <b>${state.cart.length}</b> · итоговый кэф: <b>${oddsText(total)}</b>`));
    if (total > state.limits.max_odds) {
      summary.append(el("div", "hint", `Кэф выше потолка ${state.limits.max_odds} — убери лишний исход.`));
    }
    card.append(summary);

    const place = el("button", "btn", "Поставить экспресс");
    place.type = "button";
    place.addEventListener("click", () => openExpressSheet());
    card.append(place);

    const clear = el("button", "btn ghost", "Очистить");
    clear.type = "button";
    clear.style.marginTop = "8px";
    clear.addEventListener("click", () => {
      state.cart = [];
      saveCart(); renderExpress(); renderCartBar();
      toast("Корзина очищена");
    });
    card.append(clear);
    host.append(card);

    if (state.expresses.length) {
      host.append(el("h2", null, "Открытые экспрессы"));
      state.expresses.forEach((express) => {
        const row = el("div", "rowcard");
        const grow = el("div", "grow");
        grow.append(el("b", null, `Экспресс #${express.id}`));
        grow.append(el("span", null, `${money(express.stake)} × ${oddsText(express.odds)}`));
        row.append(grow);
        row.append(el("div", "money plus", money(express.potential)));
        host.append(row);
      });
    }
  }

  function renderTop(rows) {
    const host = $("#top");
    host.textContent = "";
    if (!rows || !rows.length) {
      host.append(el("div", "empty", "Пока никто не играл."));
      return;
    }
    const medals = ["🥇", "🥈", "🥉"];
    rows.forEach((row) => {
      const node = el("div", "rowcard");
      node.append(el("div", "rank", medals[row.rank - 1] || String(row.rank)));
      const grow = el("div", "grow");
      grow.append(el("b", null, row.name + (row.me ? " · вы" : "")));
      grow.append(el("span", null, row.me ? "это вы" : "игрок"));
      node.append(grow, el("div", "money", money(row.balance)));
      host.append(node);
    });
  }

  function renderHistory(items) {
    const host = $("#history");
    host.textContent = "";
    if (!items || !items.length) {
      host.append(el("div", "empty", "История пуста — сделай первую ставку."));
      return;
    }
    const card = el("div", "card");
    items.forEach((item) => {
      const row = el("div", "rowcard");
      row.style.margin = "0";
      row.style.border = "0";
      row.style.borderBottom = "1px dashed #223143";
      row.style.borderRadius = "0";
      row.style.padding = "10px 0";
      row.style.background = "transparent";
      const grow = el("div", "grow");
      grow.append(el("b", null, item.reason));
      const d = new Date(item.at * 1000);
      grow.append(el("span", null, d.toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })));
      row.append(grow);
      row.append(el("div", "money " + (item.delta >= 0 ? "plus" : "minus"), (item.delta >= 0 ? "+" : "−") + money(Math.abs(item.delta))));
      card.append(row);
    });
    host.append(card);
  }

  function renderMe() {
    const host = $("#me");
    host.textContent = "";
    if (!state.user) {
      host.append(el("div", "empty", "Откройте приложение кнопкой в боте."));
      return;
    }

    const card = el("div", "card");
    const kv = (label, value) => {
      const row = el("div", "kv");
      row.append(el("span", null, label));
      row.append(el("b", null, value));
      card.append(row);
    };
    kv("Игрок", state.user.name);
    kv("Баланс", money(state.user.balance));
    kv("Ставок в игре", String(state.bets.length));
    kv("Экспрессов в игре", String(state.expresses.length));
    kv("Минимальная ставка", money(state.limits.min_bet));
    host.append(card);

    const bonus = el("button", "btn", `🎁 Забрать бонус ${money(state.limits.daily_bonus)}`);
    bonus.type = "button";
    bonus.addEventListener("click", claimBonus);
    host.append(bonus);

    if (state.bets.length) {
      host.append(el("h2", null, "Ставки в игре"));
      state.bets.forEach((bet) => {
        const row = el("div", "rowcard");
        const grow = el("div", "grow");
        grow.append(el("b", null, bet.team));
        grow.append(el("span", null, `${bet.team_a} — ${bet.team_b} · кэф ${oddsText(bet.odds)}`));
        row.append(grow, el("div", "money", money(bet.amount)));
        host.append(row);
      });
    }

    const rules = el("div", "card");
    rules.append(el("h2", null, "Правила"));
    rules.append(el("div", "hint",
      "Матчи и кэфы — реальная линия Fonbet, только турниры тир-1 (IEM, ESL Pro League, BLAST, PGL, мейджоры). " +
      "Кэф фиксируется в момент ставки, приём закрывается со стартом матча. " +
      `Выплата = ставка × кэф. Экспресс: 2–${state.limits.max_legs} исходов, кэфы перемножаются, ` +
      `потолок ${state.limits.max_odds}. Отменённый матч считается с кэфом 1.0. ` +
      "Монеты виртуальные, вывести их нельзя."));
    host.append(rules);
  }

  // --------------------------------------------------------------- действия
  function openSheet(build) {
    const wrap = $("#sheetWrap");
    const sheet = $("#sheet");
    sheet.textContent = "";
    build(sheet);
    wrap.classList.add("show");
  }
  function closeSheet() { $("#sheetWrap").classList.remove("show"); }

  function openAmountSheet(match, side) {
    haptic("light");
    const team = side === "a" ? match.team_a : match.team_b;
    const odd = side === "a" ? match.odds_a : match.odds_b;

    openSheet((sheet) => {
      sheet.append(el("h3", null, team));
      sheet.append(el("div", "sub", `${match.short_tournament} · кэф ${oddsText(odd)} · ${timeText(match.start_time)}`));

      const summary = el("div", "summary");
      const sumText = el("div");
      sumText.innerHTML = `Ставка: <b>—</b> · выигрыш: <span class="big">—</span>`;
      summary.append(sumText);
      sheet.append(summary);

      const presets = el("div", "presets");
      const amounts = [50, 100, 250, 500, 1000].filter((value) => value <= balance());
      if (!amounts.length) amounts.push(state.limits.min_bet);

      let chosen = amounts[0];

      const place = el("button", "btn", "Поставить");
      place.type = "button";
      const paint = () => {
        sumText.innerHTML = `Ставка: <b>${money(chosen)}</b> · выигрыш: <span class="big">${money(Math.round(chosen * odd))}</span>`;
      };

      const markChosen = (btn) => {
        [...presets.children].forEach((node) => { node.style.borderColor = "#2a3b4f"; node.style.background = ""; });
        if (btn) { btn.style.borderColor = "#3d8fd8"; btn.style.background = "#21384e"; }
      };

      amounts.forEach((amount) => {
        const btn = el("button", null, money(amount));
        btn.type = "button";
        btn.addEventListener("click", () => { chosen = amount; paint(); markChosen(btn); haptic("light"); });
        presets.append(btn);
      });

      const allBtn = el("button", "wide", `💥 Всё · ${money(balance())}`);
      allBtn.type = "button";
      allBtn.addEventListener("click", () => { chosen = balance(); paint(); markChosen(allBtn); haptic("light"); });
      if (balance() >= state.limits.min_bet) presets.append(allBtn);

      const custom = el("div", "custom");
      const input = el("input");
      input.type = "number";
      input.inputMode = "numeric";
      input.min = String(state.limits.min_bet);
      input.placeholder = "своя сумма";
      input.addEventListener("input", () => {
        const value = parseInt(input.value, 10);
        if (!isNaN(value) && value > 0) { chosen = value; paint(); markChosen(null); }
      });
      custom.append(input);
      const customBtn = el("button", "btn small", "OK");
      customBtn.type = "button";
      customBtn.style.flex = "0 0 74px";
      customBtn.addEventListener("click", () => { input.focus(); haptic("light"); });
      custom.append(customBtn);

      sheet.append(presets, custom);
      paint();
      markChosen(presets.children[0]);

      place.addEventListener("click", async () => {
        if (chosen < state.limits.min_bet) { toast(`Минимум ${money(state.limits.min_bet)}`, "bad"); return; }
        if (chosen > balance()) { toast("Не хватает монет", "bad"); return; }
        place.disabled = true;
        place.textContent = "Отправляю…";
        try {
          const data = await api("/api/bet", { method: "POST", body: { match_id: match.id, side, amount: chosen } });
          setBalance(data.balance);
          closeSheet();
          haptic("ok");
          toast(`Ставка принята · кэф ${oddsText(data.odds)} · выигрыш ${money(data.potential)}`, "ok");
          refreshState();
        } catch (err) {
          haptic("bad");
          toast(err.message, "bad");
          place.disabled = false;
          place.textContent = "Поставить";
        }
      });
      sheet.append(place);

      const cancel = el("button", "btn ghost", "Отмена");
      cancel.type = "button";
      cancel.style.marginTop = "8px";
      cancel.addEventListener("click", closeSheet);
      sheet.append(cancel);
    });
  }

  function openExpressSheet() {
    if (state.cart.length < 2) { toast("Нужно минимум 2 исхода", "bad"); return; }
    const total = cartOdds();
    if (total > state.limits.max_odds) { toast(`Кэф выше потолка ${state.limits.max_odds}`, "bad"); return; }

    openSheet((sheet) => {
      sheet.append(el("h3", null, `Экспресс · ${state.cart.length} исхода`));
      sheet.append(el("div", "sub", `итоговый кэф ${oddsText(total)}`));

      const summary = el("div", "summary");
      const sumText = el("div");
      summary.append(sumText);
      sheet.append(summary);

      const presets = el("div", "presets");
      const amounts = [50, 100, 250, 500, 1000].filter((value) => value <= balance());
      if (!amounts.length) amounts.push(state.limits.min_bet);
      let chosen = amounts[0];
      const paint = () => {
        sumText.innerHTML = `Ставка: <b>${money(chosen)}</b> · выигрыш: <span class="big">${money(Math.round(chosen * total))}</span>`;
      };
      const markChosen = (btn) => {
        [...presets.children].forEach((node) => { node.style.borderColor = "#2a3b4f"; node.style.background = ""; });
        if (btn) { btn.style.borderColor = "#3d8fd8"; btn.style.background = "#21384e"; }
      };
      amounts.forEach((amount) => {
        const btn = el("button", null, money(amount));
        btn.type = "button";
        btn.addEventListener("click", () => { chosen = amount; paint(); markChosen(btn); });
        presets.append(btn);
      });
      const allBtn = el("button", "wide", `💥 Всё · ${money(balance())}`);
      allBtn.type = "button";
      allBtn.addEventListener("click", () => { chosen = balance(); paint(); markChosen(allBtn); });
      if (balance() >= state.limits.min_bet) presets.append(allBtn);
      sheet.append(presets);
      paint();
      markChosen(presets.children[0]);

      const place = el("button", "btn", "Поставить экспресс");
      place.type = "button";
      place.addEventListener("click", async () => {
        if (chosen > balance()) { toast("Не хватает монет", "bad"); return; }
        place.disabled = true;
        place.textContent = "Отправляю…";
        try {
          const data = await api("/api/express", {
            method: "POST",
            body: { amount: chosen, legs: state.cart.map((leg) => ({ match_id: leg.match_id, side: leg.side })) },
          });
          setBalance(data.balance);
          state.cart = [];
          saveCart();
          closeSheet();
          haptic("ok");
          toast(`Экспресс #${data.express_id} принят · кэф ${oddsText(data.odds)}`, "ok");
          renderCartBar();
          refreshState();
          switchTab("express");
        } catch (err) {
          haptic("bad");
          toast(err.message, "bad");
          place.disabled = false;
          place.textContent = "Поставить экспресс";
        }
      });
      sheet.append(place);

      const cancel = el("button", "btn ghost", "Отмена");
      cancel.type = "button";
      cancel.style.marginTop = "8px";
      cancel.addEventListener("click", closeSheet);
      sheet.append(cancel);
    });
  }

  function addLeg(match) {
    if (state.cart.some((leg) => leg.match_id === match.id)) {
      toast("Этот матч уже в корзине", "bad");
      return;
    }
    if (state.cart.length >= state.limits.max_legs) {
      toast(`Максимум ${state.limits.max_legs} исходов`, "bad");
      return;
    }
    openSheet((sheet) => {
      sheet.append(el("h3", null, "Какой исход берём?"));
      sheet.append(el("div", "sub", match.short_tournament));
      const pick = (side) => {
        const team = side === "a" ? match.team_a : match.team_b;
        const odd = side === "a" ? match.odds_a : match.odds_b;
        state.cart.push({
          match_id: match.id,
          side,
          team,
          odds: odd,
          tournament: match.short_tournament,
        });
        saveCart();
        closeSheet();
        renderExpress();
        renderCartBar();
        haptic("ok");
        const total = cartOdds();
        toast(`Добавлено: ${team} · кэф ${oddsText(total)}` + (state.cart.length < 2 ? " · нужен ещё исход" : ""), "ok");
      };
      [["a", match.team_a, match.odds_a], ["b", match.team_b, match.odds_b]].forEach(([side, team, odd]) => {
        const btn = el("button", "btn ghost");
        btn.type = "button";
        btn.style.marginBottom = "8px";
        btn.style.justifyContent = "space-between";
        btn.append(el("span", null, team), el("b", null, oddsText(odd)));
        btn.addEventListener("click", () => pick(side));
        sheet.append(btn);
      });
      const cancel = el("button", "btn ghost", "Отмена");
      cancel.type = "button";
      cancel.addEventListener("click", closeSheet);
      sheet.append(cancel);
    });
  }

  async function claimBonus() {
    try {
      const data = await api("/api/bonus", { method: "POST" });
      setBalance(data.balance);
      if (data.received) {
        haptic("ok");
        toast(`Бонус ${money(data.amount)} зачислен`, "ok");
      } else {
        const hours = Math.floor(data.wait_seconds / 3600);
        const minutes = Math.floor((data.wait_seconds % 3600) / 60);
        toast(`Бонус уже получен. Следующий через ${hours} ч ${minutes} мин`, "bad");
      }
      refreshState();
    } catch (err) {
      toast(err.message, "bad");
    }
  }

  // ------------------------------------------------------------- навигация
  function switchTab(tab) {
    state.tab = tab;
    document.querySelectorAll(".screen").forEach((node) => node.classList.remove("active"));
    const screen = document.getElementById("screen-" + tab);
    if (screen) screen.classList.add("active");
    document.querySelectorAll("nav.tabs button").forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.tab === tab);
    });
    if (tab === "top") loadTop();
    if (tab === "history") loadHistory();
    if (tab === "me") renderMe();
    if (tab === "express") renderExpress();
    haptic("light");
  }

  async function loadTop() {
    try {
      const data = await api("/api/top");
      renderTop(data.top);
    } catch (err) {
      $("#top").textContent = "";
      $("#top").append(el("div", "empty", err.message));
    }
  }

  async function loadHistory() {
    try {
      const data = await api("/api/history");
      renderHistory(data.items);
    } catch (err) {
      $("#history").textContent = "";
      $("#history").append(el("div", "empty", err.message));
    }
  }

  async function refreshState() {
    try {
      const data = await api("/api/state");
      state.user = data.user;
      state.matches = data.matches;
      state.bets = data.bets;
      state.expresses = data.expresses;
      state.limits = data.limits;
      state.live = true;
      renderHeader();
      renderMatches();
      renderCartBar();
      if (state.tab === "express") renderExpress();
      if (state.tab === "me") renderMe();
    } catch (err) {
      if (err.status === 401) {
        state.user = boot.user || null;
        renderHeader();
        renderMatches();
        return;
      }
      // если сервер недоступен, но данные пришли вместе со страницей — не стираем экран
      if (state.user && state.matches.length) {
        toast("Превью-режим: показан снимок данных, ставки требуют сервера", "bad");
        return;
      }
      renderFatal(err.message || "Сервер недоступен");
    }
  }

  // ------------------------------------------------------------------- init
  function init() {
    renderHeader();
    renderMatches();
    renderExpress();
    renderCartBar();
    renderMe();
    switchTab("matches");

    document.querySelectorAll("nav.tabs button").forEach((btn) => {
      btn.addEventListener("click", () => switchTab(btn.dataset.tab));
    });
    $("#cartOpen").addEventListener("click", () => switchTab("express"));
    $("#sheetWrap").addEventListener("click", (event) => {
      if (event.target === $("#sheetWrap")) closeSheet();
    });

    if (tg) {
      try {
        tg.ready();
        tg.expand();
        if (tg.setHeaderColor) tg.setHeaderColor("#0f1720");
        if (tg.setBackgroundColor) tg.setBackgroundColor("#0f1720");
        if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
        const theme = tg.themeParams || {};
        if (theme.button_color) document.documentElement.style.setProperty("--accent", theme.button_color);
      } catch (e) { /* старые клиенты */ }
    }

    refreshState();
  }

  document.addEventListener("DOMContentLoaded", init);
  if (document.readyState !== "loading") init();
})();
</script>
</body>
</html>
