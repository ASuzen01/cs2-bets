<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>CS2 BETS</title>
<!-- BOOTSTRAP -->
<script async src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
/* Мост к Telegram без ожидания внешнего SDK.
   Telegram кладёт данные приложения в hash: #tgWebAppData=...&tgWebAppVersion=...
   Если telegram.org недоступен (бывает), приложение всё равно работает. */
(function () {
  var hash = (location.hash || "").replace(/^#/, "");
  var params = {};
  hash.split("&").forEach(function (part) {
    var i = part.indexOf("=");
    if (i > 0) params[decodeURIComponent(part.slice(0, i))] = decodeURIComponent(part.slice(i + 1));
  });

  var initData = params.tgWebAppData || "";
  var theme = {};
  if (params.tgWebAppThemeParams) {
    try { theme = JSON.parse(params.tgWebAppThemeParams); } catch (e) { theme = {}; }
  }
  var user = {};
  if (initData) {
    try { user = JSON.parse(new URLSearchParams(initData).get("user") || "{}"); } catch (e) { user = {}; }
  }
  function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

  window.__TG_SHIM__ = {
    initData: initData,
    initDataUnsafe: { user: user },
    themeParams: theme,
    platform: params.tgWebAppPlatform || "",
    version: params.tgWebAppVersion || "",
    ready: function () {},
    expand: function () {},
    close: function () {},
    setHeaderColor: function () {},
    setBackgroundColor: function () {},
    disableVerticalSwipes: function () {},
    HapticFeedback: {
      impactOccurred: function () { buzz(8); },
      notificationOccurred: function () { buzz(20); }
    }
  };
})();
</script>

<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header>
  <div class="logo">🎯</div>
  <div class="who">
    <b id="userName">CS2 BETS</b>
    <span id="userHint">кэфы Fonbet · тир-1</span>
  </div>
  <div class="balance" id="balancePill">— 🪙</div>
</header>

<main>
  <section class="screen active" id="screen-matches">
    <h2>Матчи · тир-1</h2>
    <div id="matches"></div>
  </section>

  <section class="screen" id="screen-express">
    <h2>Экспресс</h2>
    <div id="express"></div>
  </section>

  <section class="screen" id="screen-bets">
    <h2>История ставок</h2>
    <div id="bets"><div class="skeleton"></div><div class="skeleton"></div></div>
  </section>

  <section class="screen" id="screen-top">
    <h2>Топ по балансу</h2>
    <div id="top"><div class="skeleton"></div><div class="skeleton"></div></div>
  </section>

  <section class="screen" id="screen-history">
    <h2>История операций с балансом</h2>
    <div id="history"><div class="skeleton"></div></div>
  </section>

  <section class="screen" id="screen-me">
    <h2>Профиль</h2>
    <div id="me"></div>
  </section>
</main>

<div class="cartbar" id="cartbar">
  <div class="grow">
    <b id="cartTitle">Экспресс: 0 исходов</b>
    <span id="cartOdds">добавь минимум 2</span>
  </div>
  <button class="btn small" id="cartOpen">Открыть</button>
</div>

<nav class="tabs">
  <button class="active" data-tab="matches"><span class="ic">🎮</span>Матчи</button>
  <button data-tab="express" id="tabExpress"><span class="ic">🎟</span>Экспресс<span class="dot" id="cartDot">0</span></button>
  <button data-tab="bets" id="tabBets"><span class="ic">🎯</span>Ставки<span class="dot" id="betsDot">0</span></button>
  <button data-tab="top"><span class="ic">🏆</span>Топ</button>
  <button data-tab="history"><span class="ic">📜</span>Деньги</button>
  <button data-tab="me"><span class="ic">💰</span>Я</button>
</nav>

<div class="sheet-wrap" id="sheetWrap">
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast" id="toast"></div>

<script src="/static/app.js" defer></script>
</body>
</html>
