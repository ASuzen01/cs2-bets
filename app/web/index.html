<script async src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
/* Мост к Telegram без ожидания внешнего SDK.
   Telegram кладёт данные приложения в hash: #tgWebAppData=...&tgWebAppVersion=...
   Если telegram.org недоступен (бывает), приложение всё равно работает. */
(function () {
  var hash = (location.hash || "").replace(/^#/, "");
  var params = {};
  hash.split("&").forEach(function (part) {
    var i = part.indexOf("=");
    if (i > 0) params[decodeURIComponent(part.slice(0, i))] = decodeURIComponent(part.slice(i + 1));
  });

  var initData = params.tgWebAppData || "";
  var theme = {};
  if (params.tgWebAppThemeParams) {
    try { theme = JSON.parse(params.tgWebAppThemeParams); } catch (e) { theme = {}; }
  }
  var user = {};
  if (initData) {
    try { user = JSON.parse(new URLSearchParams(initData).get("user") || "{}"); } catch (e) { user = {}; }
  }
  function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

  window.__TG_SHIM__ = {
    initData: initData,
    initDataUnsafe: { user: user },
    themeParams: theme,
    platform: params.tgWebAppPlatform || "",
    version: params.tgWebAppVersion || "",
    ready: function () {},
    expand: function () {},
    close: function () {},
    setHeaderColor: function () {},
    setBackgroundColor: function () {},
    disableVerticalSwipes: function () {},
    HapticFeedback: {
      impactOccurred: function () { buzz(8); },
      notificationOccurred: function () { buzz(20); }
    }
  };
})();
</script>

<header>

  <div class="who">

</header>

      <button class="seg" type="button" data-sport="hockey">Хоккей</button>
    </div>
    <div class="segments sports categories" id="categorySegments" hidden>
      <button class="seg active" type="button" data-category="clubs">Клубы</button>
      <button class="seg" type="button" data-category="national">Сборные</button>
    </div>
    <div class="filterrow">
      <button class="fchip" type="button" id="tourFilter">Все турниры</button>
      <button class="fchip reset" type="button" id="tourReset" hidden>Сбросить</button>
      <button class="fchip" type="button" id="favFilter" aria-pressed="false">★ Мои</button>
    </div>
    <div class="segments" id="matchSegments">
      <button class="seg active" type="button" data-segment="line">Линия</button>
      <button class="seg" type="button" data-segment="live">
        <span class="seg-dot"></span>Live<span class="seg-count" id="liveCount"></span>
      </button>
    </div>
    <div id="matches"></div>
  </section>

</div>

<script src="/static/app.js" defer></script>
