<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Добрая лудка</title>
<link rel="icon" type="image/png" href="/static/mascot.png">
<!-- BOOTSTRAP -->
<script async src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
/* Мост к Telegram без ожидания внешнего SDK.
   Telegram кладёт данные приложения в hash: #tgWebAppData=...&tgWebAppVersion=...
   Если telegram.org недоступен (бывает), приложение всё равно работает. */
(function () {
  var hash = (location.hash || "").replace(/^#/, "");
  var params = {};
  hash.split("&").forEach(function (part) {
    var i = part.indexOf("=");
    if (i > 0) params[decodeURIComponent(part.slice(0, i))] = decodeURIComponent(part.slice(i + 1));
  });

  var initData = params.tgWebAppData || "";
  var theme = {};
  if (params.tgWebAppThemeParams) {
    try { theme = JSON.parse(params.tgWebAppThemeParams); } catch (e) { theme = {}; }
  }
  var user = {};
  if (initData) {
    try { user = JSON.parse(new URLSearchParams(initData).get("user") || "{}"); } catch (e) { user = {}; }
  }
  function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

  window.__TG_SHIM__ = {
    initData: initData,
    initDataUnsafe: { user: user },
    themeParams: theme,
    platform: params.tgWebAppPlatform || "",
    version: params.tgWebAppVersion || "",
    ready: function () {},
    expand: function () {},
    close: function () {},
    setHeaderColor: function () {},
    setBackgroundColor: function () {},
    disableVerticalSwipes: function () {},
    HapticFeedback: {
      impactOccurred: function () { buzz(8); },
      notificationOccurred: function () { buzz(20); }
    }
  };
})();
</script>

<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-matches" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="7.2"/>
      <circle cx="12" cy="12" r="2.4"/>
      <path d="M12 1.6v3.2M12 19.2v3.2M1.6 12h3.2M19.2 12h3.2"/>
    </symbol>
    <symbol id="i-express" viewBox="0 0 24 24">
      <path d="M8.5 3.5h7l4 4v13h-15v-13z"/>
      <path d="M8.5 3.5v4h-4"/>
      <path d="M7.5 11.5h9M7.5 15h6" stroke-dasharray="2.2 2.2"/>
    </symbol>
    <symbol id="i-bets" viewBox="0 0 24 24">
      <path d="M5 3.5h11l3 3v14H5z"/>
      <path d="M8 8.5h8M8 12h8M8 15.5h5"/>
    </symbol>
    <symbol id="i-bonus" viewBox="0 0 24 24">
      <path d="M3.6 8.6h16.8v4H3.6zM5 12.6h14V20H5z"/>
      <path d="M12 8.6V20"/>
      <path d="M12 8.6c-1.4-3.4-6.4-3.1-5.6.2.3 1.2 2.4 1.4 5.6-.2zM12 8.6c1.4-3.4 6.4-3.1 5.6.2-.3 1.2-2.4 1.4-5.6-.2z"/>
    </symbol>
    <symbol id="i-games" viewBox="0 0 24 24">
      <rect x="3.4" y="3.4" width="10.2" height="10.2" rx="2.2"/>
      <rect x="10.4" y="10.4" width="10.2" height="10.2" rx="2.2"/>
      <circle cx="6.6" cy="6.6" r=".9" fill="currentColor" stroke="none"/>
      <circle cx="10.4" cy="10.4" r=".9" fill="currentColor" stroke="none"/>
      <circle cx="13.6" cy="13.6" r=".9" fill="currentColor" stroke="none"/>
      <circle cx="17.4" cy="17.4" r=".9" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="i-top" viewBox="0 0 24 24">
      <path d="M8 3.6h8v5.2a4 4 0 0 1-8 0z"/>
      <path d="M8 4.6H5.2a3.2 3.2 0 0 0 3.2 5.4M16 4.6h2.8a3.2 3.2 0 0 1-3.2 5.4"/>
      <path d="M12 12.8v3.6M8.6 20.4h6.8l-.8-3.6H9.4z"/>
    </symbol>
    <symbol id="i-me" viewBox="0 0 24 24">
      <circle cx="12" cy="8.4" r="3.8"/>
      <path d="M4.6 20.4c.8-3.8 3.8-5.8 7.4-5.8s6.6 2 7.4 5.8"/>
    </symbol>
    <symbol id="i-ticket" viewBox="0 0 24 24">
      <path d="M3.6 8.2h16.8v2.4a2 2 0 0 0 0 3.2v2.4H3.6v-2.4a2 2 0 0 0 0-3.2z"/>
      <path d="M12 9.4v5.6" stroke-dasharray="2 2.4"/>
    </symbol>
    <symbol id="i-check" viewBox="0 0 24 24">
      <path d="M5 12.6l4.6 4.4L19 7.4"/>
    </symbol>
  </defs>
</svg>
<header>
  <img class="mascot" src="/static/mascot.png" alt="Добрая лудка" width="40" height="40">
  <div class="who">
    <b class="brand">Добрая лудка</b>
  </div>
  <button class="bonusbell" id="bonusBell" type="button" aria-label="Бонусы" title="Бонусы">
    <svg class="ic" aria-hidden="true"><use href="#i-bonus"></use></svg>
    <span class="dot" id="bonusDot" hidden></span>
  </button>
  <div class="balance" id="balancePill">— 🪙</div>
</header>

<main>
  <section class="screen active" id="screen-matches">
    <div class="segments sports" id="sportSegments">
      <button class="seg active" type="button" data-sport="cs2">CS2</button>
      <button class="seg" type="button" data-sport="football">Футбол</button>
      <button class="seg" type="button" data-sport="hockey">Хоккей</button>
    </div>
    <div class="segments sports categories" id="categorySegments" hidden>
      <button class="seg active" type="button" data-category="clubs">Клубы</button>
      <button class="seg" type="button" data-category="national">Сборные</button>
    </div>
    <div class="filterrow">
      <button class="fchip" type="button" id="tourFilter">Все турниры</button>
      <button class="fchip reset" type="button" id="tourReset" hidden>Сбросить</button>
      <button class="fchip" type="button" id="favFilter" aria-pressed="false">★ Мои</button>
    </div>
    <div class="segments" id="matchSegments">
      <button class="seg active" type="button" data-segment="line">Линия</button>
      <button class="seg" type="button" data-segment="live">
        <span class="seg-dot"></span>Live<span class="seg-count" id="liveCount"></span>
      </button>
    </div>
    <div id="matches"></div>
  </section>

  <section class="screen" id="screen-games">
    <div class="segments" id="gameSwitch">
      <button class="seg active" type="button" data-game="roulette">Рулетка</button>
      <button class="seg" type="button" data-game="dice">Кости</button>
    </div>
    <div id="games"><div class="skeleton"></div><div class="skeleton"></div></div>
  </section>

  <section class="screen" id="screen-express">
    <h2>Экспресс</h2>
    <div id="express"></div>
  </section>

  <section class="screen" id="screen-bets">
    <h2>История ставок</h2>
    <div id="bets"><div class="skeleton"></div><div class="skeleton"></div></div>
  </section>

  <section class="screen" id="screen-top">
    <h2>Топ по балансу</h2>
    <div id="top"><div class="skeleton"></div><div class="skeleton"></div></div>
  </section>

  <section class="screen" id="screen-bonus">
    <h2>Бонусы</h2>
    <div id="bonus"></div>
  </section>

  <section class="screen" id="screen-me">
    <h2>Профиль</h2>
    <div id="me"></div>
  </section>
</main>

<div class="cartbar" id="cartbar">
  <div class="grow">
    <b id="cartTitle">Экспресс: 0 исходов</b>
    <span id="cartOdds">добавь минимум 2</span>
  </div>
  <button class="btn small" id="cartOpen">Открыть</button>
</div>

<nav class="tabs">
  <button class="active" data-tab="matches"><svg class="ic" aria-hidden="true"><use href="#i-matches"></use></svg>Матчи</button>
  <button data-tab="games" id="tabGames"><svg class="ic" aria-hidden="true"><use href="#i-games"></use></svg>Игры</button>
  <button data-tab="express" id="tabExpress"><svg class="ic" aria-hidden="true"><use href="#i-express"></use></svg>Экспресс<span class="dot" id="cartDot">0</span></button>
  <button data-tab="bets" id="tabBets"><svg class="ic" aria-hidden="true"><use href="#i-bets"></use></svg>Ставки<span class="dot" id="betsDot">0</span></button>
  <button data-tab="top"><svg class="ic" aria-hidden="true"><use href="#i-top"></use></svg>Топ</button>
  <button data-tab="me"><svg class="ic" aria-hidden="true"><use href="#i-me"></use></svg>Я</button>
</nav>

<div class="sheet-wrap" id="sheetWrap">
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast" id="toast"></div>

<script src="/static/app.js" defer></script>
</body>
</html>
