services:
  - type: web
    name: cs2-bets-bot
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /ping        # лёгкая проверка процесса без ожидания БД
    autoDeployTrigger: commit
    envVars:
      - key: RUN_MODE
        value: webhook
      # ВАЖНО: полный адрес вида https://cs2-bets-bot.onrender.com, руками (sync: false).
      # `fromService: property: host` отдаёт имя сервиса без домена — Telegram такой
      # вебхук не принимает («Failed to resolve host»), и приложение не стартует.
      - key: WEBHOOK_BASE_URL
        sync: false
      - key: WEBHOOK_PATH
        value: /webhook
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: START_BALANCE
        value: "1000"
      - key: DAILY_BONUS
        value: "250"
      - key: MIN_BET
        value: "10"
      - key: DB_PATH
        value: data/bot.db
      # чтобы балансы не терялись при перезапуске бесплатного сервиса —
      # вставьте Connection string из Neon (Postgres, free)
      - key: DATABASE_URL
        sync: false
      # мини-приложение живёт в этом же сервисе (см. run_webhook) — один адрес и одна база
      # перепроверка расчётов раз в час; «всё ок» — сводкой раз в сутки
      - key: RECHECK_INTERVAL_MINUTES
        value: "60"
      - key: RECHECK_OK_DIGEST_HOURS
        value: "24"
      # сервис пингует себя, чтобы Render не засыпал (адрес берётся из RENDER_EXTERNAL_URL)
      - key: KEEPALIVE_ENABLED
        value: "1"
      - key: KEEPALIVE_INTERVAL
        value: "600"
      - key: MINIAPP_URL
        sync: false
