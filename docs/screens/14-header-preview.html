<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Добрая лудка — превью шапки</title>
<style>
:root{
    --bg:#0f1720; --bg2:#151d26; --card:#1a2431; --card2:#202c3b;
    --text:#eaf0f6; --muted:#8496a8; --accent:#4dabf7; --accent-soft:#1d3549;
    --ok:#37b24d; --warn:#f5a623; --bad:#e03131; --line:#22303f;
    --radius:16px; --tabbar:64px;
  }
body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:15px;line-height:1.45;overscroll-behavior-y:contain}
body{padding-bottom:calc(var(--tabbar) + 12px)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;
    padding:12px 16px;background:linear-gradient(180deg,#131c26,rgba(19,28,38,.92));
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.mascot{width:40px;height:40px;flex:0 0 40px;object-fit:contain;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}
.who .brand{font-size:16px;letter-spacing:.01em}
.who{flex:1;min-width:0}
.who b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:11.5px;color:var(--muted)}
.balance{display:flex;align-items:center;gap:6px;background:#1b2a1f;border:1px solid #23452c;
    color:#a9e6b8;padding:7px 11px;border-radius:12px;font-weight:700;font-size:14px;white-space:nowrap}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
    margin:2px 0 10px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 13px;margin-bottom:10px}
.card .top{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:11.5px;margin-bottom:7px}
.card .top .tour{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.teams{display:flex;flex-direction:column;gap:7px}
.team{display:flex;gap:8px}
.odd{flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:var(--card2);border:1px solid #26374a;border-radius:12px;padding:10px 12px;
    transition:transform .08s ease,background .15s}
.odd .name{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.odd .val{font-variant-numeric:tabular-nums;font-weight:800;color:#8ecbff}
.kick{display:block;font-size:11px;color:var(--muted)}
body{padding-bottom:12px}
.wrap{max-width:420px;margin:0 auto}
.note{max-width:420px;margin:10px auto 0;color:#7d8ea3;font-size:12px;padding:0 16px}
</style></head>
